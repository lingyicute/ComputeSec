name: Build

on:
  push:
      paths:
      - 'computesec/**'
      - 'run.py'
      - 'tests/**'
      - 'data/**'
      - '*.json'
      - '*.yml'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint:
    name: Python 语法与元数据检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 编译检查
        run: python -m compileall -q computesec run.py
      - name: 运行单元测试
        run: |
          pip install pytest
          python -m pytest -q
      - name: 安装校验工具
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils appstream libxml2-utils
      - name: 校验 .desktop / metainfo / SVG
        run: |
          desktop-file-validate data/uk._92li.lingyicute.ComputeSec.desktop
          appstreamcli validate --no-net data/uk._92li.lingyicute.ComputeSec.metainfo.xml || true
          xmllint --noout data/icons/hicolor/scalable/apps/uk._92li.lingyicute.ComputeSec.svg

  flatpak:
    name: 构建 Flatpak (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: 构建并导出 bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ComputeSec-${{ matrix.arch }}.flatpak
          manifest-path: uk._92li.lingyicute.ComputeSec.json
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ github.sha }}
          arch: ${{ matrix.arch }}
          upload-artifact: true

  release:
    name: 发布 Nightly
    if: github.ref == 'refs/heads/main'
    needs: flatpak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 删除旧 nightly 并重建
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly artifacts/**/*.flatpak \
            --target "${{ github.sha }}" \
            --title "Nightly Build" \
            --prerelease \
            --notes "Nightly 自动构建：Run #${{ github.run_number }}，commit ${{ github.sha }}"

