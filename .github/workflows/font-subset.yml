name: Font Subsetting

on:
  push:
    branches: ["main"]
    paths:
      - "web/index.html"
      - "web/fonts/**"
      - "scripts/subset_font.py"
      - "scripts/.font-subset-cache.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  subset-fonts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install maintenance dependencies
        run: python -m pip install fonttools brotli

      - name: Generate cacheable font subsets
        run: python scripts/subset_font.py

      - name: Commit font updates
        env:
          COMMIT_NAME: ${{ github.actor }}
          COMMIT_EMAIL: ${{ github.event.pusher.email || format('{0}@users.noreply.github.com', github.actor) }}
        run: |
          git add web/index.html web/fonts/nebulove-subset.woff2 scripts/.font-subset-cache.json
          if git diff --cached --quiet; then
            echo "No font changes detected."
            exit 0
          fi
          git config user.name "$COMMIT_NAME"
          git config user.email "$COMMIT_EMAIL"
          git commit -m "perf: 更新字体子集"
          git push
